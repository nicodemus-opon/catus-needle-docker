# Cactus Needle 3 API server: tools are configured PER REQUEST via
# POST /complete {"tools": [...], "query": "..."} — nothing is hardcoded.
# Docs: https://cactuscompute.com/blog/needle-python-docs
# API source: https://github.com/cactus-compute/needle/blob/main/needle/playground/server.py

services:
  needle3:
    build:
      context: .
      # Uncomment to bake training deps in and enable POST /finetune:
      # args:
      #   CACTUS_NEEDLE_SPEC: "cactus-needle[train]>=3,<4"
    image: cactus-needle3:latest
    # NOTE: no `container_name`, `ports`, or custom `networks` here on purpose —
    # Coolify manages naming/networking and routes via its proxy (see README).
    # Local `docker compose up` auto-merges docker-compose.override.yml for ports.
    expose:
      - "7860"
    environment:
      NEEDLE_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
    restart: unless-stopped
    healthcheck:
      # Cheap liveness probe: GET /model does zero inference (just returns
      # {"name": ...}). Do NOT probe POST /complete here — Engine.complete()
      # takes a lock and runs CPU-bound inference, so a 15s inference probe
      # with timeout > interval piles up threads and pegs CPU at idle.
      test: ["CMD", "curl", "-f", "http://localhost:7860/model"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Serve a fine-tuned archive instead of the base model:
    #   1. place tuned.cact next to the compose file
    #   2. point --weights at it in the command below
    # volumes:
    #   - ./tuned.cact:/app/tuned.cact:ro
    # Load the base weights explicitly (same file the server would fetch by
    # default) so GET /model reports {"name": "needle3.cact"} instead of the
    # stale upstream default label "needle-2 (base)". See README.
    command: ["--host", "0.0.0.0", "--port", "7860", "--weights", "/app/needle3.cact"]
